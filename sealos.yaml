# Sealos 部署配置（适用于 Sealos 云 / 自建 K8s 集群）
# 部署前先创建 Secret，再应用本文件：
#   kubectl create secret generic xiaoban-tutor-secrets --from-literal=DEEPSEEK_API_KEY='替换为真实密钥'
#   kubectl apply -f sealos.yaml
#
# 部署前请先做两件事：
#   1. 构建并推送镜像，把下方 Deployment 的 image 替换成你的镜像地址。
#   2. 创建名为 xiaoban-tutor-secrets 的 Secret；不要把真实密钥写入或提交到 Git。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiaoban-tutor
  labels:
    app: xiaoban-tutor
    cloud.sealos.io/app-deploy-manager: xiaoban-tutor
  annotations:
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
    deploy.cloud.sealos.io/resize: "0"
    originImageName: xiaoban-tutor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xiaoban-tutor
  template:
    metadata:
      labels:
        app: xiaoban-tutor
    spec:
      containers:
        - name: xiaoban-tutor
          # 镜像地址（由 GitHub Actions 自动构建并推送到 GHCR）：
          image: "ghcr.io/stevenwang6/xiaoban-tutor:latest"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xiaoban-tutor-secrets
                  key: DEEPSEEK_API_KEY
            # 非敏感配置，可按需覆盖
            - name: DEEPSEEK_MODEL
              value: "deepseek-flash"
            - name: DEEPSEEK_BASE_URL
              value: "https://api.deepseek.com"
            - name: RATE_LIMIT_REQUESTS
              value: "20"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: xiaoban-tutor
  labels:
    app: xiaoban-tutor
    cloud.sealos.io/app-deploy-manager: xiaoban-tutor
spec:
  type: ClusterIP
  selector:
    app: xiaoban-tutor
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xiaoban-tutor
  labels:
    app: xiaoban-tutor
    cloud.sealos.io/app-deploy-manager: xiaoban-tutor
    cloud.sealos.io/app-deploy-manager-domain: xiaoban-tutor
  annotations:
    # Sealos 云（cloud.sealos.io）使用 nginx ingress + 平台通配证书自动处理 HTTPS，
    # 无需 cert-manager。此处对齐集群内既有 Ingress 的注解写法。
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  rules:
    - host: xiaoban-tutor.cloud.sealos.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xiaoban-tutor
                port:
                  number: 80
  tls:
    - hosts:
        - xiaoban-tutor.cloud.sealos.io
      secretName: wildcard-cloud-sealos-io-cert
