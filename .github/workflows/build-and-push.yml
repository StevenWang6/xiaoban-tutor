name: build-and-push

# 鍦ㄤ簯绔紙GitHub Actions锛夋瀯寤?Docker 闀滃儚骞舵帹閫佸埌 GitHub Container Registry (GHCR)銆?
# 涓嶄緷璧栨湰鏈?Docker锛屾棤闇€棰濆闀滃儚浠撳簱璐﹀彿锛屼娇鐢ㄨ嚜鍔ㄦ敞鍏ョ殑 GITHUB_TOKEN銆?
# 鏋勫缓浜х墿锛歡hcr.io/stevenwang6/xiaoban-tutor:latest

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stevenwang6/xiaoban-tutor:latest
            ghcr.io/stevenwang6/xiaoban-tutor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
