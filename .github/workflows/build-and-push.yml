name: build-and-push

# 在云端（GitHub Actions）构建 Docker 镜像并推送到 GitHub Container Registry (GHCR)。
# 不依赖本机 Docker，无需额外镜像仓库账号，使用自动注入的 GITHUB_TOKEN。
# 构建产物：ghcr.io/stevenwang6/xiaoban-tutor:latest

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stevenwang6/xiaoban-tutor:latest
            ghcr.io/stevenwang6/xiaoban-tutor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
